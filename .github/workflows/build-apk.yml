name: Build & Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Auto-increment version
        id: version
        run: |
          NEW_VERSION=$(node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            let [major, minor, patch] = pkg.version.split('.').map(Number);
            patch++;
            if (patch >= 100) { patch = 0; minor++; }
            if (minor >= 100) { minor = 0; major++; }
            pkg.version = \`\${major}.\${minor}.\${patch}\`;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log(pkg.version);
          ")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          
          # Configure Git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || echo "No changes to commit"
          git push

      - name: Build web app
        run: npm run build
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_APP_VERSION: ${{ steps.version.outputs.new_version }}

      - name: Initialize Android platform
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease
        env:
          RELEASE_KEYSTORE_PASSWORD: "jjNzXD8fnlo9Em1kkV74h05h"
          RELEASE_KEY_ALIAS: "moneymanager"
          RELEASE_KEY_PASSWORD: "jjNzXD8fnlo9Em1kkV74h05h"

      - name: Rename and Locate APK
        id: apk
        run: |
          ORIGINAL_APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          NEW_NAME="MoneyManager-Build${{ github.run_number }}.apk"
          mv "$ORIGINAL_APK" "android/app/build/outputs/apk/release/$NEW_NAME"
          echo "path=android/app/build/outputs/apk/release/$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NEW_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: money-manager-build-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: "Money Manager v${{ steps.version.outputs.new_version }}"
          body: |
            **Build:** #${{ github.run_number }}
            **Version:** ${{ steps.version.outputs.new_version }}
            **Commit:** ${{ github.sha }}

            ### Install
            Download `${{ steps.apk.outputs.name }}` and open it on your Android device.
            Enable *Install from unknown sources* if prompted.

            ### Auto-updates
            Existing installs receive web-bundle updates automatically via Capgo
            (no reinstall needed for UI/logic changes after the initial APK install).
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload OTA bundle to Capgo
        continue-on-error: true
        env:
          CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
        run: |
          if [ -n "$CAPGO_API_KEY" ]; then
            echo "Uploading web bundle to Capgo..."
            npx @capgo/cli bundle upload \
              --apikey "$CAPGO_API_KEY" \
              --channel production
          else
            echo "CAPGO_API_KEY not configured — OTA upload skipped."
            echo "APK-only releases are still published to GitHub Releases above."
          fi
