name: Build & Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Initialize Android platform
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Sync web assets into Android project
        run: npx cap sync android

      # The keystore is committed at signing/release.keystore (private repo).
      # Credentials are embedded here — rotate by regenerating the keystore
      # and running: npx cap sync android + commit both files.
      - name: Inject signing config into build.gradle
        run: |
          python3 << 'PYEOF'
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          # Path is relative to the android/app/ module directory
          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("../../signing/release.keystore")
                      storePassword "jjNzXD8fnlo9Em1kkV74h05h"
                      keyAlias "moneymanager"
                      keyPassword "jjNzXD8fnlo9Em1kkV74h05h"
                  }
              }
          '''

          content = content.replace('    buildTypes {', signing_block + '    buildTypes {', 1)
          content = content.replace(
              "proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'",
              "proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'\n            signingConfig signingConfigs.release"
          )

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)

          print("Signing config injected successfully")
          PYEOF

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Locate built APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $APK)" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: money-manager-build-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Money Manager – Build #${{ github.run_number }}"
          body: |
            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### Install
            Download `${{ steps.apk.outputs.name }}` and open it on your Android device.
            Enable *Install from unknown sources* if prompted.

            ### Auto-updates
            Existing installs receive web-bundle updates automatically via Capgo
            (no reinstall needed for UI/logic changes after the initial APK install).
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── OTA live updates via Capgo (optional) ─────────────────────────────
      # After the first APK is installed, JS/asset changes are delivered OTA
      # without users ever needing to reinstall.
      - name: Upload OTA bundle to Capgo
        env:
          CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
        run: |
          if [ -n "$CAPGO_API_KEY" ]; then
            echo "Uploading web bundle to Capgo..."
            npx @capgo/cli bundle upload \
              --apikey "$CAPGO_API_KEY" \
              --channel production
          else
            echo "CAPGO_API_KEY not configured — OTA upload skipped."
            echo "APK-only releases are still published to GitHub Releases above."
          fi
